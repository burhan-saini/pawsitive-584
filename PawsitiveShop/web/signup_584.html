<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style_584.css">
        <title>Signup</title>
        
        <!-- GOOGLE FONT -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        
        <!-- ICONS -->
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    </head>
    
    <body>

        <!-- Background glow effects -->
        <div class="bg-glow"></div>
        <div class="bg-glow2"></div>

        <div class="container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="logo">My Dashboard</div>
                    <ul>
                        <li><a href="dashboard.html"><i class="fas fa-home"></i> Home</a></li>
                    </ul>
                </div>

            <!-- Main content -->
                <div class="main">
                    <div class="section">
                        <div class="section-title">
                            <h2>Signup</h2>
                        </div>

                        <form>
                            <label for="username">Username:</label>
                            <input type="text" id="username" placeholder="Enter username" required>

                            <label for="fullname">Full Name:</label>
                            <input type="text" id="fullname" placeholder="Enter full name">

                            <label for="email">Email:</label>
                            <input type="email" id="email" placeholder="Enter email" required>

                            <label for="password">Password:</label>
                            <input type="password" id="password" placeholder="Enter password" required>

                            <label for="confirmPassword">Confirm Password:</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                            <label for="address">Address:</label>
                            <input type="text" id="address" placeholder="Enter address">

                            <label for="postcode">Postal Code:</label>
                            <input type="text" id="postcode" placeholder="Enter postal code">

                            <label for="city">City:</label>
                            <input type="text" id="city" placeholder="Enter city">

                            <label for="phone">Phone Number:</label>
                            <input type="text" id="phone" placeholder="Enter phone number">

                            <div class="actions" style="margin-top:20px;">
                                <button class="signup" type="submit">Sign Up</button>
                            </div>
                        </form>
                    </div>

                    <footer>
                    © 2026 PAW-STIVE Dashboard
                    </footer>

                </div>
            </div>
        </div>
    </body>
</html>
