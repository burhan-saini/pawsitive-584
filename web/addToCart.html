<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LocalShop Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f5f5;
    }

    /* Header */
    header {
      background-color: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* Container */
    .container {
      display: flex;
      justify-content: space-between;
      padding: 20px;
    }

    /* Product list */
    .products {
      flex: 2;
      margin-right: 20px;
    }

    .product {
      background: #fff;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      margin-right: 15px;
    }

    .product-info {
      flex: 1;
    }

    .product-actions {
      text-align: right;
    }

    button {
      background-color: #512da8;
      color: #fff;
      border: none;
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Sidebar */
    .sidebar {
      flex: 1;
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .place-order {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #512da8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    .place-order:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>LocalShop</header>
  <h1 style="text-align: center;">Cart</h1>

  <div class="container">
    <!-- Product list -->
    <div class="products">
      <div class="product">
        <img src="maggi.png" alt="Product">
        <div class="product-info">
          <strong>Maggi Tomyam</strong><br>
          In Stock<br>
          RM 5.90
        </div>
        <div class="product-actions">
          <button>-</button>
          <span>1</span>
          <button>+</button><br>
          <input type="checkbox"> Select
        </div>
      </div>

      <div class="product">
        <img src="nestum.png" alt="Product">
        <div class="product-info">
          <strong>Nestum Original</strong><br>
          In Stock<br>
          RM 20.90
        </div>
        <div class="product-actions">
          <button>-</button>
          <span>2</span>
          <button>+</button><br>
          <input type="checkbox"> Select
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <h3>Payment Method</h3>
      <label><input type="radio" name="payment"> Credit Card</label><br>
      <label><input type="radio" name="payment"> PayPal</label><br>
      <label><input type="radio" name="payment"> Cash on Delivery</label><br><br>

      <h3>Order Summary</h3>
      <p>Subtotal: RM 26.80</p>
      <p>Shipping: RM 5.00</p>
      <p><strong>Total: RM 31.80</strong></p>

      <button class="place-order">Place My Order</button>
    </div>
  </div>
</body>
</html>
